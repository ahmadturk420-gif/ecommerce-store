<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwiftCart - Modern Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Navigation -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-black tracking-tight">SwiftCart</h1>
      <div class="flex items-center gap-4">
        <a href="admin.html" class="text-xs text-indigo-200 hover:text-white underline">Go to Admin</a>
        <button onclick="toggleCartDrawer(true)" class="relative bg-indigo-700 hover:bg-indigo-600 px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2">
          <span>Cart</span>
          <span id="cartCountBadge" class="bg-amber-400 text-indigo-950 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Catalog View -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-gray-900">Featured Products</h2>
      <select id="categoryFilter" class="border rounded-md px-3 py-1.5 text-sm bg-white shadow-sm focus:outline-indigo-500">
        <option value="">All Categories</option>
        <option value="Apparel">Apparel</option>
        <option value="Electronics">Electronics</option>
        <option value="Accessories">Accessories</option>
      </select>
    </div>

    <!-- Product Grid -->
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Injected by shop.js -->
    </div>
  </main>

  <!-- Slide-out Cart Drawer -->
  <div id="cartDrawer" class="hidden fixed inset-0 z-50 overflow-hidden">
    <div onclick="toggleCartDrawer(false)" class="absolute inset-0 bg-black bg-opacity-40 transition-opacity"></div>
    <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
      <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col justify-between">
        
        <div class="p-6 overflow-y-auto">
          <div class="flex justify-between items-center pb-4 border-b">
            <h3 class="text-lg font-bold text-gray-900">Your Shopping Cart</h3>
            <button onclick="toggleCartDrawer(false)" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
          </div>
          <div id="cartItemsContainer" class="divide-y divide-gray-100 my-4">
            <!-- Dynamic Cart Items -->
          </div>
        </div>

        <!-- Checkout Section -->
        <div class="p-6 bg-gray-50 border-t space-y-3">
          <div class="flex justify-between text-base font-bold text-gray-900">
            <span>Total:</span>
            <span id="cartTotalDisplay">PKR 0</span>
          </div>

          <form id="checkoutForm" class="space-y-2 pt-2">
            <input type="text" id="custName" required placeholder="Full Name" class="w-full border rounded px-3 py-1.5 text-sm" />
            <input type="text" id="custPhone" required placeholder="Phone Number (e.g. 03001234567)" class="w-full border rounded px-3 py-1.5 text-sm" />
            <textarea id="custAddress" required placeholder="Complete Delivery Address" rows="2" class="w-full border rounded px-3 py-1.5 text-sm"></textarea>
            <div id="orderStatusMsg" class="text-xs font-bold"></div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow text-sm">
              Confirm Cash On Delivery
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <footer class="bg-gray-100 border-t py-4 text-center text-xs text-gray-500">
    SwiftCart Demo Storefront • Rawalpindi / Islamabad
  </footer>

  <script src="js/shop.js"></script>
</body>
</html>
